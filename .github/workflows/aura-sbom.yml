# Generated by Aura. Review before merging; protected refs only.
name: Aura SBOM
on:
  push:
    tags:
      - "**"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  aura_sbom:
    if: ${{ github.ref_protected && (github.ref_type == 'tag' || github.event_name
      == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Generate CycloneDX
        uses: docker://ghcr.io/sbomify/sbomify-action@sha256:309b2ce0c6a2ec9eb6fbcd692b7473cfa891882e4eb6192f7a158ce57c7d2ff0
        env:
          LOCK_FILE: package-lock.json
          OUTPUT_FILE: aura-sbom.cdx.json
          ENRICH: "true"
          UPLOAD: "false"
          SBOM_FORMAT: cyclonedx
          SPEC_VERSION: "1.6"
      - name: Upload once to Aura
        env:
          AURA_PROJECT_ID: cmugwevnv0001sjvbqwvhqyqh
          AURA_UPLOAD_URL: https://aura-dev.linuscent.com/api/sbom/upload
          AURA_API_KEY: ${{ secrets.AURA_SBOM_7D849A1C9D5345C8B972CFF98877B458 }}
          AURA_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: >-
          python3 - <<'AURA_PYTHON'

          import json, os, pathlib, sys, urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          try:
              path = pathlib.Path("aura-sbom.cdx.json")
              if path.stat().st_size > 10 * 1024 * 1024:
                  raise ValueError("size")
              document = json.loads(path.read_text(encoding="utf-8"))
              if document.get("bomFormat") != "CycloneDX":
                  raise ValueError("format")
              version = os.environ.get("AURA_TAG", "")
              component = document.get("metadata", {}).get("component")
              if version and isinstance(component, dict):
                  component["version"] = version
              body = json.dumps({"projectId": os.environ["AURA_PROJECT_ID"], "sbomContent": json.dumps(document)}).encode()
              if len(body) > 10 * 1024 * 1024:
                  raise ValueError("size")
              key = os.environ["AURA_API_KEY"]
              if not key:
                  raise ValueError("credential")
              request = urllib.request.Request(os.environ["AURA_UPLOAD_URL"], data=body, headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"}, method="POST")
              with urllib.request.build_opener(NoRedirect).open(request, timeout=60) as response:
                  receipt = json.loads(response.read(65537))
                  if response.status != 202 or receipt.get("status") != "accepted" or not isinstance(receipt.get("upload", {}).get("id"), str):
                      raise ValueError("receipt")
              print("Aura accepted the SBOM for asynchronous analysis. A new release was created.")
          except Exception:
              sys.exit("Aura upload failed or its outcome is unknown. Do not retry automatically: inspect Aura releases first; each accepted upload creates a release.")
          AURA_PYTHON
